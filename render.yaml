services:
  - type: web
    name: marketmind-analytics-api
    runtime: docker
    dockerfilePath: ./analytics-service/Dockerfile
    dockerContext: ./analytics-service
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketmind-db
          property: connectionString
      - key: REDIS_HOST
        value: ""
      - key: REDIS_PORT
        value: "6379"
      - key: ALLOWED_ORIGINS
        value: "https://market-mind-ai-q1kl.vercel.app,https://marketmindai.vercel.app,http://localhost:5173,http://localhost:5174,https://market-mind-ai-q1kl-d5pdk6nyj-sahils-projects-190569f9.vercel.app,https://market-mind-ai-q1kl-7thjg7boe-sahils-projects-190569f9.vercel.app,https://market-mind-ai-q1kl-furcu1nou-sahils-projects-190569f9.vercel.app"
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_AI_SERVICE
        value: "true"
      - key: AI_SERVICE_URL
        value: "https://marketmind-ai-service.onrender.com"
      - key: SKIP_RAG_INIT
        value: "true"
      - key: ENABLE_AUTO_SYNC
        value: "false"

  - type: web
    name: marketmind-ai-service
    runtime: docker
    dockerfilePath: ./analytics-service/ai-service/Dockerfile
    dockerContext: ./analytics-service
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: "groq"
      - key: GROQ_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: marketmind-db
          property: connectionString
      - key: SKIP_RAG_INIT
        value: "true"

databases:
  - name: marketmind-db
    plan: free
    databaseName: marketmind
    user: marketmind_user
