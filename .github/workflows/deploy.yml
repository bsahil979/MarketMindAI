name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Build & Test all services (runs on every push/PR)
  # ─────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- INGESTION SERVICE ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Ingestion Service
        run: |
          cd ingestion-service
          mvn clean compile

      # --- ANALYTICS SERVICE ---
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          cd analytics-service
          pip install -r requirements.txt

      # --- DASHBOARD ---
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package.json

      - name: Build Dashboard
        run: |
          cd dashboard
          npm install
          npm run build
        env:
          # Make sure the dashboard build embeds the backend URL during Vite build.
          # Set this secret in the repo to your Render backend URL, e.g.
          # https://marketmind-analytics-api.onrender.com
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # ─────────────────────────────────────────────────────────
  # JOB 2: Deploy (only on push to main, after CI passes)
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Deploy Dashboard → Vercel ──────────────────────
      - name: Build Dashboard locally
        run: |
          cd dashboard
          npm ci
          npm run build
        env:
          # Vite replaces this value in the production bundle. Without it, the
          # browser sends /stocks and /prices requests to Vercel, not Render.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          
      - name: Copy built files to root for Vercel deployment
        run: |
          # Remove existing index.html to avoid conflicts
          rm -f index.html
          # Copy dist contents to root since Vercel project expects root deployment
          cp -r dashboard/dist/* .
          
      - name: Deploy Dashboard to Vercel (using latest CLI)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Deploying dashboard with latest Vercel CLI"
          # Deploy from root with pre-built files, skip Vercel build
          npx vercel@latest --prod -t "$VERCEL_TOKEN" --yes --force --no-build

      # ── Deploy Analytics API → Render ─────────────────
      - name: Trigger Render Deploy (Analytics API)
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'
          echo "✅ Render deploy triggered for Analytics API"

      - name: Deployment Summary
        run: |
          echo "🚀 Deployment complete!"
          echo "📊 Dashboard:    https://marketmindai.vercel.app"
          echo "🔌 Analytics API: https://marketmind-analytics-api.onrender.com"
          echo "📋 Render Docs:  https://dashboard.render.com"
